version: '3.8'

services:
  solesphere-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solesphere_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=solesphere_production_secret_key_2026
    volumes:
      - solesphere-data:/app/data
    restart: always

volumes:
  solesphere-data:
